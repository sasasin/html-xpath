[project]
name = "html-xpath"
version = "0.1.0"
description = "Fetch rendered HTML fragments from a URL using XPath selectors."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "playwright>=1.45",
]

[project.scripts]
html-xpath = "html_xpath.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
